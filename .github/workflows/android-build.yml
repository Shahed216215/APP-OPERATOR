name: Android Build Verification

on:
  push:
    branches:
      - evolution-20-native-android
  pull_request:
    branches:
      - main
      - evolution-20-native-android
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    name: Test and assemble Operator APK variants
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android 35 SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Run full and safe-demo JVM unit tests
        run: gradle --no-daemon :app:testFullDebugUnitTest :app:testSafeDemoDebugUnitTest

      - name: Upload JVM test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mira-operator-jvm-test-results
          path: app/build/test-results/**/TEST-*.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Build full Operator APK
        run: gradle --no-daemon :app:assembleFullDebug

      - name: Upload full Operator APK
        uses: actions/upload-artifact@v4
        with:
          name: mira-operator-full-apk
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build UI-only safe demo APK
        run: gradle --no-daemon :app:assembleSafeDemoDebug

      - name: Upload UI-only safe demo APK
        uses: actions/upload-artifact@v4
        with:
          name: mira-operator-safe-demo-apk
          path: app/build/outputs/apk/safeDemo/debug/*.apk
          if-no-files-found: error
          retention-days: 7
