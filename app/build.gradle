plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.mira.operator'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mira.operator'
        minSdk 29
        targetSdk 32
        versionCode 1
        versionName '0.1.0'
    }

    // Keep the original full Operator APK and isolate the UI-only demo.
    flavorDimensions "operatorMode"
    productFlavors {
        full {
            dimension "operatorMode"
        }
        safeDemo {
            dimension "operatorMode"
            applicationIdSuffix ".demo"
            versionNameSuffix "-demo"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.activity:activity-ktx:1.10.0'
}
